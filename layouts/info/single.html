{{ define "main" }}
<div class="container py-4">
  <div class="row">
    <div class="col-lg-8">
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{{ "/" | relURL }}">Home</a></li>
          <li class="breadcrumb-item"><a href="{{ "/info/" | relURL }}">Info</a></li>
          <li class="breadcrumb-item active">{{ .Title }}</li>
        </ol>
      </nav>

      <article class="info-article">
        <h1 class="mb-4">{{ .Title }}</h1>
        <div class="article-body">
          {{ .Content }}
        </div>
      </article>

      <div class="mt-4">
        <a href="{{ "/info/" | relURL }}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Back to Info
        </a>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="sidebar-widget">
        <div class="widget-header">
          <h3><i class="bi bi-list-ul"></i> In This Section</h3>
        </div>
        {{ $infoPages := where .Site.RegularPages "Section" "info" }}
        {{ range $infoPages }}
        <div class="recent-item {{ if eq .Title $.Title }}active{{ end }}">
          <a href="{{ .RelPermalink }}" class="recent-link">{{ .Title }}</a>
        </div>
        {{ end }}
      </div>
    </div>
  </div>
</div>
{{ end }}
